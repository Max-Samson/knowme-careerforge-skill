name: knowme-careerforge
description: An agent-native skill for self-discovery, career positioning, and tailored resume engineering.
version: 0.0.5
entrypoint: SKILL.md
tools:
  - name: forge
    command: python3 scripts/pipeline/forge.py
  - name: search-template
    command: python3 scripts/template/search-template.py
  - name: analyze-jd
    command: python3 scripts/evidence/analyze-jd.py
  - name: instantiate-resume
    command: python3 scripts/template/instantiate-resume.py
  - name: validate-resume
    command: python3 scripts/validation/validate-resume.py
  - name: render-pdf
    command: python3 scripts/rendering/render-pdf.py
rules:
  - "Execute tools silently in background with --quiet (DO NOT print raw HTML, full CSS, or scripts in chat)."
  - "Use the current isolated run canvas and preserve Master/Variant lineage."
  - "Deliver only the current PASS manifest outputs; report DRAFT, FAIL and UNVERIFIED accurately."
  - "Reference AGENT.md, ARCHITECTURE.md, and references/01~06 for complete specifications."
