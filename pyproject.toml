[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowme-careerforge-skill"
version = "0.0.3"
description = "An agent-native skill for self-discovery, career positioning, and tailored resume engineering."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Miles", email = "maxshuai355@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Max-Samson/knowme-careerforge-skill"
Documentation = "https://github.com/Max-Samson/knowme-careerforge-skill#readme"
Repository = "https://github.com/Max-Samson/knowme-careerforge-skill.git"
"Bug Tracker" = "https://github.com/Max-Samson/knowme-careerforge-skill/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
